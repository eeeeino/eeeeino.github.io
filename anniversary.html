<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 17 Months Anniversary</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 60px 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            z-index: 10;
            position: relative;
        }

        h1 {
            font-size: 3.5em;
            color: #fff;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: fadeInDown 1s ease-out;
        }

        .music-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid rgba(255, 255, 255, 0.3);
        }

        .music-label {
            font-size: 1.2em;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 15px;
            font-weight: bold;
        }

        .song-title {
            font-size: 1.8em;
            color: #ffd700;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .artist {
            font-size: 1.2em;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
        }

        .music-player {
            width: 100%;
            margin-top: 20px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
        }

        iframe {
            width: 100%;
            height: 315px;
            border-radius: 10px;
            border: none;
        }

        .heart {
            display: inline-block;
            color: #ff1493;
            font-size: 2em;
            animation: heartbeat 1.2s infinite;
            margin: 0 10px;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.3); }
            50% { transform: scale(1); }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .decoration {
            font-size: 2em;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="stars" id="starContainer"></div>

    <div class="container">
        <div class="heart">💕</div>
        <h1>Happy 17 Months Anniversary</h1>
        <h2 style="font-size: 2.2em; color: #fff; text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);">My Adam</h2>
        
        <div class="decoration">✨ 🌟 ✨</div>

        <div class="music-section">
            <p class="music-label">Now Playing</p>
            <p class="song-title">Stars</p>
            <p class="artist">by VIZE</p>
            
            <div class="music-player">
                <iframe src="https://www.youtube.com/embed/wAvzTXv9Mvc?si=LJQ3_WkQUJFL5Acn" 
                        allowfullscreen="" 
                        loading="lazy" 
                        referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>
        </div>

        <div class="heart">💕</div>
    </div>

    <script>
        // Create twinkling stars background
        const starContainer = document.getElementById('starContainer');
        
        function createStar() {
            const star = document.createElement('div');
            star.className = 'star';
            
            const size = Math.random() * 3;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            
            const x = Math.random() * 100;
            const y = Math.random() * 100;
            star.style.left = x + '%';
            star.style.top = y + '%';
            
            const duration = 2 + Math.random() * 3;
            star.style.animationDuration = duration + 's';
            
            starContainer.appendChild(star);
        }
        
        for (let i = 0; i < 50; i++) {
            createStar();
        }
    </script>
</body>
</html>
