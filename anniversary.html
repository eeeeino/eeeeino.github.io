<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 17 Months Anniversary 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hearts {
            font-size: 40px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        h1 {
            color: #764ba2;
            font-size: 48px;
            margin-bottom: 30px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .message {
            color: #333;
            font-size: 28px;
            margin: 30px 0;
            font-style: italic;
            line-height: 1.6;
        }

        .music-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #ddd;
        }

        .music-label {
            color: #764ba2;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .music-title {
            color: #555;
            font-size: 16px;
            margin-bottom: 15px;
        }

        iframe {
            width: 100%;
            height: 315px;
            border-radius: 10px;
            border: none;
        }

        .footer {
            margin-top: 30px;
            color: #999;
            font-size: 14px;
        }

        .sparkles {
            display: inline-block;
            margin: 0 10px;
            animation: sparkle 2s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hearts">💕 ✨ 💕</div>
        <h1>Happy 17 Months<br>Anniversary!</h1>
        <p class="message">
            🎉 Happy 17 Months Anniversary, My Adam 🎉
        </p>

        <div class="music-section">
            <div class="music-label">🎵 Our Song 🎵</div>
            <div class="music-title">Stars by VIZE</div>
            <iframe width="560" height="315" 
                src="https://www.youtube.com/embed/wAvzTXv9Mvc?si=LJQ3_WkQUJFL5Acn" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>

        <div class="footer">
            <p><span class="sparkles">✨</span> With all my love <span class="sparkles">✨</span></p>
        </div>
    </div>
</body>
</html>
